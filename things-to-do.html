<style>
  :root{
    --bg:#F7F5EE; --panel:#FFFFFF; --panel-raised:#F0EDE3; --line:#D8D3C4;
    --ink:#10201A; --ink-dim:#4A5C50; --green:#0F6E42; --green-dim:#0B8A50;
    --gold:#8A6A1E; --focus:#0B8A50;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:radial-gradient(1200px 600px at 90% -10%, rgba(15,110,66,0.06), transparent 60%), var(--bg);
    color:var(--ink); font-family:'IBM Plex Sans', sans-serif; -webkit-font-smoothing:antialiased;}
  a{color:inherit; text-decoration:none;}

  .topbar{display:flex; align-items:center; justify-content:space-between; padding:18px 28px;
    border-bottom:1px solid var(--line); position:sticky; top:0; z-index:20;
    background:rgba(247,245,238,0.94); backdrop-filter:blur(8px);}
  .brand{font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:20px; display:flex; align-items:center; gap:10px;}
  .brand .dot{width:9px;height:9px;border-radius:50%;background:var(--green); }
  .brand small{font-family:'IBM Plex Mono', monospace; font-weight:500; font-size:11px; color:var(--ink-dim); letter-spacing:0.08em; margin-left:6px;}
  .menu-toggle{font-family:'Space Grotesk', sans-serif; background:var(--panel-raised); color:var(--ink);
    border:1px solid var(--line); border-radius:8px; padding:10px 16px; font-size:14px; font-weight:600;
    cursor:pointer; display:flex; align-items:center; gap:8px;}
  .menu-toggle .chev{transition:transform .2s ease;}
  .menu-toggle.open .chev{transform:rotate(180deg);}

  .panel-wrap{max-height:0; overflow:hidden; transition:max-height .35s ease; border-bottom:1px solid var(--line);}
  .panel-wrap.open{max-height:none;}
  .panel{padding:24px 28px 40px; background:var(--panel);}
  .panel-head{display:flex; align-items:center; justify-content:space-between; gap:20px; flex-wrap:wrap; margin-bottom:20px;}
  .panel-head h2{font-family:'Space Grotesk', sans-serif; font-size:15px; font-weight:600; color:var(--ink-dim);
    letter-spacing:0.08em; text-transform:uppercase; margin:0;}
  .search{position:relative; min-width:260px; flex:1; max-width:420px;}
  .search input{width:100%; background:var(--panel-raised); border:1px solid var(--line); border-radius:8px;
    padding:10px 14px 10px 34px; color:var(--ink); font-family:'IBM Plex Sans', sans-serif; font-size:14px;}
  .search input:focus{outline:none; border-color:var(--green-dim);}
  .search::before{content:"⌕"; position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--ink-dim); font-size:15px;}
  .count-chip{font-family:'IBM Plex Mono', monospace; font-size:12px; color:var(--gold);
    border:1px solid rgba(232,184,75,0.35); border-radius:20px; padding:4px 10px;}

  .grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(300px,1fr)); gap:12px;}
  .sector{border:1px solid var(--line); border-radius:10px; background:var(--panel-raised); overflow:hidden;}
  .sector-head{display:flex; align-items:center; gap:12px; padding:14px 16px; cursor:pointer; user-select:none;}
  .switch{width:34px; height:18px; border-radius:20px; background:#E4DFCF; border:1px solid var(--line); position:relative; flex:none; transition:background .2s ease;}
  .switch::after{content:""; position:absolute; top:2px; left:2px; width:12px; height:12px; border-radius:50%; background:var(--ink-dim); transition:all .2s ease;}
  .sector.on .switch{background:rgba(15,110,66,0.18); border-color:var(--green-dim);}
  .sector.on .switch::after{left:18px; background:var(--green); }
  .sector-title-wrap{flex:1; display:flex; align-items:center; gap:8px; min-width:0;}
  .sector-title{font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:14.5px;}
  .sector-title a{border-bottom:1px dotted transparent;}
  .sector-title a:hover{color:var(--focus); border-bottom-color:var(--focus);}
  .sector-count{font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--ink-dim); flex:none;}
  .sector-body{max-height:0; overflow:hidden; transition:max-height .3s ease; border-top:1px solid transparent;}
  .sector.on .sector-body{max-height:3000px; border-top-color:var(--line);}
  .act-list{list-style:none; margin:0; padding:8px 8px 12px;}
  .act-list li{display:flex; gap:8px; align-items:flex-start; padding:6px 10px; border-radius:6px; font-size:13px; line-height:1.4;}
  .act-list li:hover{background:rgba(15,110,66,0.07);}
  .act-list li::before{content:"›"; color:var(--green); flex:none; font-weight:600;}
  .act-num{font-family:'IBM Plex Mono', monospace; color:var(--ink-dim); font-size:11px; flex:none; width:26px;}

  .no-results{color:var(--ink-dim); font-size:13.5px; padding:20px 4px; display:none;}
  .panel-foot{margin-top:22px; padding-top:16px; border-top:1px solid var(--line); font-size:12.5px; color:var(--ink-dim);
    display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px;}
  .panel-foot a{color:var(--focus); border-bottom:1px dotted var(--focus);}

  @media (max-width:640px){.topbar{padding:14px 16px;} .panel{padding:18px 16px 24px;} .search{min-width:0;}}
</style>

const grid = document.getElementById("sectorGrid");
document.getElementById("countChip").textContent =
  SECTIONS.reduce((n,s)=>n+s.items.length,0) + " total";

SECTIONS.forEach(sec => {
  const el = document.createElement("div");
  el.className = "sector";
  el.dataset.name = sec.name.toLowerCase();

  const titleHtml = sec.href
    ? `<a href="${sec.href}">${sec.name}</a>`
    : sec.name;

  const head = document.createElement("div");
  head.className = "sector-head";
  head.innerHTML = `
    <span class="switch"></span>
    <span class="sector-title-wrap"><span class="sector-title">${titleHtml}</span></span>
    <span class="sector-count">${sec.items.length}</span>
  `;
  head.querySelector(".switch").addEventListener("click", () => el.classList.toggle("on"));
  head.querySelector(".sector-count").addEventListener("click", () => el.classList.toggle("on"));

  const body = document.createElement("div");
  body.className = "sector-body";
  const ul = document.createElement("ul");
  ul.className = "act-list";
  sec.items.forEach((it, i) => {
    const li = document.createElement("li");
    li.dataset.text = it.toLowerCase();
    li.innerHTML = `<span class="act-num">${i+1}.</span><span>${it}</span>`;
    ul.appendChild(li);
  });
  body.appendChild(ul);
  el.appendChild(head);
  el.appendChild(body);
  grid.appendChild(el);
});

const searchInput = document.getElementById("searchInput");
const noResults = document.getElementById("noResults");
searchInput.addEventListener("input", () => {
  const q = searchInput.value.trim().toLowerCase();
  let anyVisible = false;
  document.querySelectorAll(".sector").forEach(sectorEl => {
    const sectorMatch = sectorEl.dataset.name.includes(q);
    let hasMatch = q === "" ? false : sectorMatch;
    sectorEl.querySelectorAll(".act-list li").forEach(li => {
      const match = q === "" ? true : (li.dataset.text.includes(q) || sectorMatch);
      li.style.display = match ? "" : "none";
      if (match && q !== "") hasMatch = true;
      if (match) anyVisible = true;
    });
    if (q === "") { sectorEl.style.display = ""; sectorEl.classList.remove("on"); }
    else { sectorEl.style.display = hasMatch ? "" : "none"; sectorEl.classList.toggle("on", hasMatch); }
  });
  noResults.style.display = (q !== "" && !anyVisible) ? "block" : "none";
});

const menuToggle = document.getElementById("menuToggle");
const panelWrap = document.getElementById("panelWrap");
menuToggle.addEventListener("click", () => {
  const isOpen = panelWrap.classList.toggle("open");
  menuToggle.classList.toggle("open", isOpen);
  menuToggle.setAttribute("aria-expanded", isOpen);
});
</script>
