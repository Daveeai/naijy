<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Naijy Messages</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth.js"></script>
<script src="core.js"></script>
<script src="naijy-nav.js"></script>
<style>
  :root{--bg:#0b0e14;--panel:#141925;--accent:#2ecc71;--text:#e8ecf1;--muted:#8b95a7;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,Segoe UI,Roboto,sans-serif;}
  .wrap{max-width:600px;margin:0 auto;padding:24px 16px 80px;}
  h1{font-size:20px;margin-bottom:4px;}
  .sub{color:var(--muted);font-size:14px;margin-bottom:20px;}
  .conv-item{display:flex;justify-content:space-between;align-items:center;background:var(--panel);
    border:1px solid #232b3d;border-radius:12px;padding:14px 16px;margin-bottom:10px;cursor:pointer;}
  .conv-left b{display:block;font-size:15px;}
  .conv-left span{color:var(--muted);font-size:13px;}
  .conv-tag{font-size:11px;background:#1c2436;color:#8b95a7;padding:3px 8px;border-radius:20px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Messages</h1>
  <div class="sub">Every conversation, across every Naijy platform, in one place.</div>
  <div id="convList">Loading...</div>
</div>

<script>
let currentUser = null;

async function init() {
  currentUser = await getCurrentUser();
  if (!currentUser) { window.location.href = "login.html"; return; }

  const { data } = await supabaseClient
    .from("conversations")
    .select("*")
    .or(`user_a.eq.${currentUser.id},user_b.eq.${currentUser.id}`)
    .order("created_at", { ascending: false });

  const list = document.getElementById("convList");
  if (!data || data.length === 0) { list.innerHTML = "<div class='sub'>No conversations yet.</div>"; return; }

  list.innerHTML = data.map(c => {
    const otherUser = c.user_a === currentUser.id ? c.user_b : c.user_a;
    return `
      <div class="conv-item" onclick="openConversation('${otherUser}','${c.platform_context}','${c.reference_id || ''}')">
        <div class="conv-left">
          <b>Conversation on ${c.platform_context}</b>
          <span>${c.reference_id ? 'Re: ' + c.reference_id : 'General'}</span>
        </div>
        <div class="conv-tag">${c.platform_context}</div>
      </div>`;
  }).join("");
}

function openConversation(otherUserId, platform, reference) {
  // Redirects into that platform's page so the floating chat widget
  // opens with full context restored — chat never loses its origin.
  window.location.href = `${platform.toLowerCase()}.html?chat_with=${otherUserId}&ref=${reference}`;
}

init();
</script>
</body>
</html>
